<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クローラ明細確認</title>
    <script type="importmap">
      {
        "imports": {
          "@google/generative-ai": "https://esm.run/@google/generative-ai"
        }
      }
    </script>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WXBP6CPKLP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-WXBP6CPKLP');
    </script>
    
    <style>
        :root {
            --primary: #2c3e50;
            --bg-color: #f8f9fa;
            --accent: #0056b3;
            --error-bg: #ffe6e6;
            --success-bg: #e6ffe6;
        }
        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            margin: 0; padding: 20px; line-height: 1.6;
        }
        h1 {
            color: var(--primary);
            text-align: center;
            border-bottom: 3px solid var(--accent);
            padding-bottom: 10px;
        }
        .container {
            max-width: 900px; margin: 0 auto;
            background: white; padding: 20px;
            border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .input-group { margin-bottom: 15px; }
        label {
            display: block; font-weight: bold; margin-bottom: 5px;
            color: var(--primary); font-size: 0.9rem;
        }
        input[type="password"], input[type="file"] {
            width: 100%; padding: 10px; border: 1px solid #ccc;
            border-radius: 4px; box-sizing: border-box;
        }
        .btn-run {
            width: 100%; padding: 15px; background-color: var(--accent);
            color: white; border: none; border-radius: 4px;
            font-size: 1.2rem; font-weight: bold; cursor: pointer;
        }
        .btn-run:hover { background-color: #004494; }
        .btn-run:disabled { background-color: #ccc; cursor: not-allowed; }
        .api-note {
            font-size: 0.8rem; color: #666; background: #eee;
            padding: 10px; border-radius: 4px; margin-bottom: 20px;
        }
        #loading-msg {
            text-align: center; font-weight: bold; color: var(--accent);
            display: none; margin-top: 20px;
        }
        #result-area { display: none; margin-top: 30px; }
        table {
            width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem;
        }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: right; }
        th { background-color: var(--primary); color: white; text-align: center; }
        td:first-child { text-align: center; font-weight: bold; }
        .error-row { background-color: var(--error-bg); }
        .error-text { color: red; font-size: 0.8rem; display: block; font-weight: bold; }
        .summary-box {
            background: var(--success-bg); padding: 15px; border-radius: 5px;
            margin-bottom: 20px; border: 1px solid #b3ffb3;
        }
        .summary-box.has-error {
            background: var(--error-bg); border-color: #ffb3b3;
        }
        .editable-input {
            width: 100%; max-width: 90px; padding: 4px;
            border: 1px solid #ccc; border-radius: 4px;
            text-align: right; font-family: inherit;
            font-size: 0.9rem; background-color: #fff;
        }
        .editable-input:focus {
            outline: none; border-color: var(--accent);
            box-shadow: 0 0 3px rgba(0, 86, 179, 0.5);
        }
        .editable-input.edited {
            background-color: #fff3cd; border-color: #ffeeba; color: #856404;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>クローラ明細確認 v1.2</h1>
        
        <div class="api-note">
            <strong>APIキー設定（初回のみ）</strong><br>
            ブラウザに保存されるため、次回以降の入力は不要です。
        </div>
        <div class="input-group">
            <input type="password" id="api-key" placeholder="Google Gemini APIキーを入力">
        </div>

        <div class="input-group">
            <label>設計書（複数枚）の写真を一括選択してください</label>
            <input type="file" id="image-upload" accept="image/*" multiple>
        </div>
        
        <button class="btn-run" id="btn-run">画像を読み込んで検算スタート</button>
        
        <div id="loading-msg">
            ⏳ AIが表を読み取り、JSが検算中です...<br>
            <span style="font-size: 0.8rem; color:#666;" id="loading-detail">※複数枚ある場合は少し時間がかかります</span>
        </div>

        <div id="result-area">
            <div id="summary-area" class="summary-box"></div>
            <p style="font-size: 0.85rem; color: #666; margin-bottom: 5px;">※表内の数値は直接クリックして修正できます。修正すると即座に再計算されます。</p>
            <h3>検算結果明細</h3>
            <table id="result-table">
                <thead>
                    <tr>
                        <th>測点</th>
                        <th>単距離</th>
                        <th>標準単価</th>
                        <th>平均単価</th>
                        <th>直接工事費</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";

        const btn = document.getElementById('btn-run');
        const loading = document.getElementById('loading-msg');
        const loadingDetail = document.getElementById('loading-detail');
        const resultArea = document.getElementById('result-area');
        const apiKeyInput = document.getElementById('api-key');
        const imageInput = document.getElementById('image-upload');

        let currentData = null;
        let audioCtx = null; 

        const savedKey = localStorage.getItem('gemini_api_key_check');
        if(savedKey) apiKeyInput.value = savedKey;

        // iOSオーディオロック解除
        function unlockAudio() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            gain.gain.value = 0;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(0);
            osc.stop(audioCtx.currentTime + 0.01);
        }

        // ビープ音
        function playSound(type) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (type === 'success') {
                [0, 0.2, 0.4].forEach(delay => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.type = 'sine'; osc.frequency.value = 880; 
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime + delay);
                    osc.start(audioCtx.currentTime + delay);
                    osc.stop(audioCtx.currentTime + delay + 0.1);
                });
            } else if (type === 'error') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sawtooth'; osc.frequency.value = 150; 
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.5);
            }
        }

        // タイムアウトを90秒に拡張
        const MODEL_CANDIDATES = ["gemini-3.6-flash", "gemini-2.5-flash"];

        async function fetchWithTimeout(url, options, timeoutMs = 90000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try { return await fetch(url, { ...options, signal: controller.signal }); } 
            finally { clearTimeout(timer); }
        }

        async function callGeminiWithFallback(apiKey, basePayload, onStatusUpdate) {
            let lastErrorMsg = "";
            for (const modelName of MODEL_CANDIDATES) {
                if (onStatusUpdate) onStatusUpdate(modelName);
                const isGemini3 = modelName.startsWith("gemini-3");
                const payloadWithThinking = JSON.parse(JSON.stringify(basePayload));
                if (isGemini3) {
                    payloadWithThinking.generationConfig = {
                        ...(payloadWithThinking.generationConfig || {}),
                        thinkingConfig: { thinkingLevel: "LOW" }
                    };
                }
                try {
                    let response = await fetchWithTimeout(
                        `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`,
                        { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payloadWithThinking) },
                        90000
                    );
                    let data = await response.json();
                    if (data.error && response.status === 400 && isGemini3) {
                        response = await fetchWithTimeout(
                            `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`,
                            { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(basePayload) },
                            90000
                        );
                        data = await response.json();
                    }
                    if (data.error) {
                        lastErrorMsg = `[${modelName}] ${data.error.message}`;
                        continue;
                    }
                    if (data.candidates && data.candidates[0] && data.candidates[0].content) {
                        const parts = data.candidates[0].content.parts || [];
                        const answerPart = parts.find(p => typeof p.text === 'string' && !p.thought) || parts.find(p => typeof p.text === 'string');
                        if (answerPart) { return { text: answerPart.text, usedModel: modelName }; }
                    }
                } catch (err) {
                    lastErrorMsg = `[${modelName}] ${err.name === 'AbortError' ? 'タイムアウト(90秒超過)' : err.message}`;
                }
            }
            throw new Error(lastErrorMsg || "AIモデルでの通信に失敗しました。APIキーや利用制限をご確認ください。");
        }
        
        async function fileToGenerativePart(file) { 
            return new Promise((resolve) => { 
                const reader = new FileReader(); 
                reader.onloadend = () => { 
                    resolve({ inlineData: { data: reader.result.split(',')[1], mimeType: file.type } }); 
                }; 
                reader.readAsDataURL(file); 
            }); 
        } 

        function renderTable(data) {
            const tbody = document.querySelector('#result-table tbody');
            tbody.innerHTML = '';
            data.rows.forEach((row, index) => {
                const tr = document.createElement('tr');
                tr.id = `row-${index}`;
                const createInput = (field, val) => {
                    return `<input type="number" step="any" class="editable-input" data-index="${index}" data-field="${field}" value="${val !== null ? val : ''}">`;
                };
                tr.innerHTML = `
                    <td>${row.sokuten || ''}</td>
                    <td>${createInput('tan_kyori', row.tan_kyori)}</td>
                    <td>${createInput('hyojun_tanka', row.hyojun_tanka)}</td>
                    <td>${createInput('heikin_tanka', row.heikin_tanka)}<span class="err-heikin"></span></td>
                    <td>${createInput('kojihi', row.kojihi)}<span class="err-kojihi"></span></td>
                `;
                tbody.appendChild(tr);
            });

            document.querySelectorAll('.editable-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    const idx = parseInt(e.target.dataset.index);
                    const field = e.target.dataset.field;
                    const val = e.target.value !== '' ? parseFloat(e.target.value) : null;
                    currentData.rows[idx][field] = val;
                    e.target.classList.add('edited');
                    recalculate(currentData);
                });
            });
            recalculate(data);
        }

        function recalculate(data) {
            let prevTanka = 0;
            let calcTotalKojihi = 0;
            let calcTotalKyori = 0;
            let errorCount = 0;

            data.rows.forEach((row, index) => {
                const tr = document.getElementById(`row-${index}`);
                const errHeikin = tr.querySelector('.err-heikin');
                const errKojihi = tr.querySelector('.err-kojihi');
                errHeikin.innerHTML = ''; errKojihi.innerHTML = '';
                tr.classList.remove('error-row');

                let currentTanka = row.hyojun_tanka || 0;
                let tanKyori = row.tan_kyori || 0;
                if (row.sokuten && row.sokuten.includes('-BP')) prevTanka = 0;

                let expectedHeikin = Math.floor((prevTanka + currentTanka) / 2);
                let expectedKojihi = null;
                let isError = false;
                
                if (tanKyori > 0) {
                    if (row.heikin_tanka !== null && row.heikin_tanka !== expectedHeikin) {
                        isError = true;
                        errHeikin.innerHTML = `<br><span class="error-text">平均単価 NG (正解: ${expectedHeikin})</span>`;
                    }
                    expectedKojihi = Math.floor(tanKyori * expectedHeikin);
                    if (row.kojihi !== null && row.kojihi !== expectedKojihi) {
                        isError = true;
                        errKojihi.innerHTML = `<br><span class="error-text">工事費 NG (正解: ${expectedKojihi.toLocaleString()})</span>`;
                    }
                    calcTotalKojihi += expectedKojihi;
                    calcTotalKyori += tanKyori;
                }
                prevTanka = currentTanka;
                if (isError) { tr.classList.add('error-row'); errorCount++; }
            });

            const summaryArea = document.getElementById('summary-area');
            calcTotalKyori = Math.round(calcTotalKyori * 10) / 10;
            let isTotalKojihiMatch = calcTotalKojihi === data.total_kojihi;
            let isTotalKyoriMatch = calcTotalKyori === data.total_kyori;
            let summaryHTML = '';

            if (errorCount === 0 && isTotalKojihiMatch && isTotalKyoriMatch) {
                summaryArea.className = 'summary-box';
                summaryHTML = `<h3>✅ すべての計算が正確です</h3>`;
            } else {
                summaryArea.className = 'summary-box has-error';
                summaryHTML = `<h3>⚠️ 計算エラーが ${errorCount} 箇所見つかりました</h3>`;
            }
            summaryHTML += `
                <ul>
                    <li><strong>単距離の合計値:</strong> 設計書 ${data.total_kyori}m (正確な検算: ${calcTotalKyori}m) ${isTotalKyoriMatch ? '✅' : '❌'}</li>
                    <li><strong>直接工事費計:</strong> 設計書 ${data.total_kojihi ? data.total_kojihi.toLocaleString() : '読取不可'}円 (正確な検算: ${calcTotalKojihi.toLocaleString()}円) ${isTotalKojihiMatch ? '✅' : '❌'}</li>
                </ul>
            `;
            summaryArea.innerHTML = summaryHTML;
        }

        btn.addEventListener('click', async () => { 
            unlockAudio();

            const apiKey = apiKeyInput.value.trim(); 
            const files = imageInput.files; 
            
            if(!apiKey) { alert('APIキーを入力してください'); return; } 
            if(files.length === 0) { alert('設計書の画像を選択してください'); return; } 
            
            localStorage.setItem('gemini_api_key_check', apiKey); 
            btn.disabled = true; loading.style.display = 'block'; resultArea.style.display = 'none'; 
            
            try { 
                let activeModelName = "準備中";
                loadingDetail.innerText = "最適なAIモデルを探しています...";

                const prompt = `
                    あなたは建設現場の設計書を厳密にチェックするアシスタントです。
                    添付された画像は、連続した森林作業道の「直接工事費明細表」です。
                    画像1枚目から順番に表のデータ行を読み取り、以下のJSONフォーマットで出力してください。

                    【非常に重要：AIの推測（忖度）を禁止】
                    1. 「標準単価（hyojun_tanka）」の列において、同じ数字が連続しているように見えても、AIの判断で勝手に前後の行と同じ数字を出力しないでください。1行ずつ独立して画像を読み取ってください。
                    2. 「A-BP」など、最初の行で「単距離」が空欄であっても、「標準単価」に数字があれば必ず読み取ってください。
                    3. 画像の中の数値には、わざと計算間違いや異常な数値が含まれています。自動計算で修正せず、見たままの数値をそのまま抽出してください。

                    {
                      "rows": [
                        { "sokuten": "A-BP", "tan_kyori": null, "hyojun_tanka": 578, "heikin_tanka": null, "kojihi": null },
                        { "sokuten": "A-1", "tan_kyori": 17.0, "hyojun_tanka": 578, "heikin_tanka": 578, "kojihi": 9826 }
                      ],
                      "total_kyori": 1285.8, "total_kojihi": 2663196
                    }

                    【厳守事項】
                    ・空欄のセルは null にしてください。
                    ・カンマは除外して数値(Number)にしてください。
                    ・「直接工事費計」などの最終合計行の値を、total_kyoriとtotal_kojihiに入れてください。見つからない場合は null にしてください。
                    ・Markdownブロック(\`\`\`json)は不要です。純粋なJSONのみを返してください。
                `;

                const imageParts = await Promise.all([...files].map(fileToGenerativePart));
                
                const basePayload = {
                    contents: [
                        {
                            parts: [
                                { text: prompt },
                                ...imageParts
                            ]
                        }
                    ],
                    generationConfig: {
                        response_mime_type: "application/json"
                    }
                };

                const res = await callGeminiWithFallback(apiKey, basePayload, (m) => {
                    activeModelName = m;
                    loadingDetail.innerText = `画像読取・検算中 (${activeModelName}を使用)...`;
                });

                let text = res.text.replace(/```json/g, '').replace(/```/g, '').trim();
                
                currentData = JSON.parse(text);
                renderTable(currentData);
                resultArea.style.display = 'block';
                
                playSound('success');

            } catch (error) {
                console.error(error);
                playSound('error');
                alert('エラーが発生しました。\n・APIキーが正しいか\n・画像の画質が低すぎないか\nを確認してください。\n詳細: ' + error.message);
            } finally {
                btn.disabled = false; loading.style.display = 'none';
            }
        });
    </script>
</body>
</html>
